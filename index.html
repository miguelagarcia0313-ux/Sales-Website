<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lizzie's Mart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Assets/CSS/styles.css">
</head>
<body>

  <!-- Top contact bar -->
  <div class="contact-bar">
    <a id="phone-link" href="tel:+529991234567" class="phone-link">
      <svg viewBox="0 0 24 24" class="phone-icon" aria-hidden="true">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/>
      </svg>
      <span id="phone-number">999 123 4567</span>
    </a>
  </div>

  <!-- Store header -->
  <header class="header">
    <div class="header-brand">
      <img src="Assets/Img/Logo.png" alt="Lizzie's Mart logo" class="brand-logo">
      <div class="brand-text">
        <h1 id="store-name" class="store-name">Lizzie's Mart</h1>
        <p class="store-tagline">Tienda de barrio · Calidad y Confianza</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="#contact-section" class="contact-cta">Contactame</a>
    </div>
  </header>

  <!-- Search and filters -->
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" class="search-icon" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Buscar productos...">
    </div>
    <div id="category-chips" class="category-chips"></div>
  </div>

  <!-- Product grid -->
  <main id="product-grid" class="product-grid"></main>

  <p id="empty-message" class="empty-message" hidden>No encontramos productos que coincidan con tu búsqueda.</p>

  <section id="contact-section" class="contact-section">
    <div class="contact-card">
      <p class="contact-eyebrow">Contact Me</p>
      <h2>Hablemos</h2>
      <p>Encuéntrame por teléfono, correo, WhatsApp o Facebook.</p>
      <div class="contact-links">
        <a href="tel:+529991234567">📞 Teléfono</a>
        <a href="mailto:hello@example.com">✉️ Correo</a>
        <a href="https://wa.me/529991234567" target="_blank" rel="noreferrer">💬 WhatsApp</a>
        <a href="https://facebook.com" target="_blank" rel="noreferrer">📘 Facebook</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>Made by Me 2026</p>
  </footer>

  <script src="Assets/Scripts/script.js"></script>
</body>
</html>
