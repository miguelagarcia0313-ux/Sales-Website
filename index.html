<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocu's Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Assets/CSS/styles.css">
</head>
<body>

  <!-- Barra de contacto superior -->
  <div class="contact-bar">
    <a id="phone-link" href="tel:+18324849161" class="phone-link">
      <svg viewBox="0 0 24 24" class="phone-icon" aria-hidden="true">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/>
      </svg>
      <span id="phone-number">832-484-9161</span>
    </a>
  </div>

  <!-- Banner de la tienda -->
  <banner class="store-banner">
    <div class="banner-content">
      <img src="Assets/Img/Logo1.png" alt="Logo de Cocu's Shop" class="banner-logo">
      <div class="banner-text">
        <h1 id="store-name" class="store-name">Cocu's Shop</h1>
        <p class="store-tagline">Tu Estilo, Tu Elección</p>
      </div>
    </div>
  </banner>

  <!-- Encabezado de la tienda con hamburguesa -->
  <header class="header">
    <button id="hamburger-menu" class="hamburger-menu" aria-label="Menú de filtros" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="header-actions">
      <a href="#contact-section" class="contact-cta">Contactame</a>
    </div>
  </header>

  <!-- Búsqueda y filtros -->
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" class="search-icon" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Buscar productos...">
    </div>
  </div>

  <!-- Sidebar de filtros -->
  <div id="category-chips" class="category-chips"></div>

  <!-- Overlay para cerrar sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Cuadrícula de productos -->
  <main id="product-grid" class="product-grid"></main>

  <p id="empty-message" class="empty-message" hidden>No encontramos productos que coincidan con tu búsqueda.</p>

  <!-- Botón de carrito flotante -->
  <button id="cart-btn" class="cart-btn">
    🛒 <span id="cart-count" class="cart-count">0</span>
  </button>

  <!-- Modal del carrito -->
  <div id="cart-modal" class="cart-modal">
    <div class="cart-modal-content">
      <div class="cart-modal-header">
        <h2>Carrito de Compras</h2>
        <button id="close-cart" class="close-cart">&times;</button>
      </div>
      <div id="cart-items" class="cart-items">
        <p class="empty-cart">Tu carrito está vacío</p>
      </div>
    </div>
  </div>

  <section id="contact-section" class="contact-section">
    <div class="contact-card">
      <p class="contact-eyebrow">Contáctame</p>
      <h2>Hablemos</h2>
      <p>Encuéntrame por Telefono o WhatsApp</p>
      <div class="contact-links">
        <a href="tel:+18324849161">📞 Teléfono</a>
        <a href="https://wa.me/18324849161" target="_blank" rel="noreferrer">💬 WhatsApp</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>Hecho por Mí 2026</p>
  </footer>

  <script src="Assets/Scripts/script.js"></script>
</body>
</html>
